# ============================================================================
# CI 持续集成流水线
#
# 目标：**坏代码进不了主干**。每次 push / PR 自动跑三类检查，
# 任何一环红了就在 PR 上打叉、阻止合并。
#
# 分三个层次，由快到慢、由便宜到贵：
#   1. lint      几秒钟   —— 格式、未使用变量、明显的坏味道
#   2. test      几分钟   —— 442 个用例（后端 379 + 前端单测 41 + E2E 由本地/部署后跑）
#   3. build     几分钟   —— 四个镜像能不能构建出来
#
# 为什么 lint 和 test 拆成不同 job：
#   lint 只要 10 秒，test 要 2 分钟。拆开后 lint 失败会立刻反馈，
#   不用等测试跑完；而且两者并行执行，总耗时取较慢的那个。
#
# 关于「Node.js 20 is deprecated」警告：
#   这是 GitHub 对 actions/checkout@v4 等官方 Action 的运行时提醒
#   （Action 声明跑在 Node 20，被强制跑在 Node 24），属于提示而非错误，
#   不影响 job 结果。升级到各 Action 的 Node 24 版本可消除，但会牵动
#   版本兼容性，留作后续独立验证。
# ============================================================================

name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  # 允许在 Actions 页面手动触发一次
  workflow_dispatch:

# 同一分支连续推送时，取消上一次还没跑完的流水线。
# 好处：省额度，且不会出现"旧提交的检查结果覆盖新提交"的困惑
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  # ══════════════════════════════════════════════════════════════════════
  # 1. 后端静态检查（最快，最先给反馈）
  # ══════════════════════════════════════════════════════════════════════
  backend-lint:
    name: 后端 · ruff 检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          # 缓存 pip 下载物：requirements 没变时跳过重复下载
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: 安装 ruff
        run: pip install ruff

      - name: 静态检查
        working-directory: backend
        run: ruff check .

      - name: 格式检查
        working-directory: backend
        run: ruff format --check .

  # ══════════════════════════════════════════════════════════════════════
  # 2. 后端测试（379 个用例）
  #
  # 需要一个真实的 PostgreSQL：因为模型里用了 pgvector 和 PostGIS 的
  # 专用字段类型，建表时必须有这两个扩展，用 SQLite 顶替不了。
  # ══════════════════════════════════════════════════════════════════════
  backend-test:
    name: 后端 · pytest
    runs-on: ubuntu-latest

    services:
      postgres:
        # pgvector 官方镜像自带 vector 扩展（项目 Dockerfile.pg 也基于它）
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: "123456"
          POSTGRES_DB: weather_db
        ports:
          - 5432:5432
        # 等数据库真正可用再开始跑步骤，避免"连不上"的偶发失败
        options: >-
          --health-cmd "pg_isready -U admin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      # PostGIS 不在 pgvector 镜像里，但 PGDG 源已经配好了，补装一个包即可
      - name: 为测试库补装 PostGIS 扩展
        run: |
          docker exec ${{ job.services.postgres.id }} bash -c \
            "apt-get update -qq -o Acquire::Retries=3 && \
             apt-get install -y -qq --no-install-recommends postgresql-17-postgis-3"
          # 立刻验证两个扩展都真的可用（缺任何一个后续建表都会失败），
          # 把结果打进注解区，这样即使看不到完整日志也能定位
          docker exec ${{ job.services.postgres.id }} \
            psql -U admin -d postgres -tAc \
            "SELECT name FROM pg_available_extensions WHERE name IN ('vector','postgis') ORDER BY name" \
            | while read -r ext; do echo "::notice::可用扩展: $ext"; done

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: 安装依赖
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: 诊断环境（CI 与本地差异往往就藏在这里）
        working-directory: backend
        run: |
          # 把关键信息用 ::notice:: 打出来——完整日志需要登录才能看，
          # 而注解区未登录也可读，便于快速定位问题
          python --version 2>&1 | while IFS= read -r l; do echo "::notice::$l"; done
          pytest --version 2>&1 | while IFS= read -r l; do echo "::notice::$l"; done
          python - <<'PY' 2>&1 | while IFS= read -r l; do echo "::notice::$l"; done
          import importlib
          for m in ("pytest_cov", "pytest_asyncio", "respx", "asyncpg", "geoalchemy2", "pgvector"):
              try:
                  importlib.import_module(m)
                  print(f"依赖可用 {m}")
              except Exception as exc:
                  print(f"依赖缺失 {m}: {exc}")
          PY

      # 测试库由 conftest.py 自动创建（weather_db_test）并建表，
      # 这里只需把连接串指过去；外部依赖（和风/高德/Tavily/LLM）全部打桩，
      # 所以 CI 里不需要任何 API Key，也不消耗额度
      #
      # 失败时把首尾日志输出成注解：pytest 的"用法错误"(exit 4) 会把原因
      # 写在最前面，而"测试失败"的信息在最后面，两头都取才够定位。
      - name: 运行测试
        working-directory: backend
        env:
          TEST_DB_URL: postgresql+asyncpg://admin:123456@127.0.0.1:5432/weather_db_test
        run: |
          set +e
          pytest 2>&1 | tee pytest-output.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            echo "::error::pytest 退出码 $code（4=用法错误 3=内部错误 1=有用例失败 5=没收集到用例）"
            head -12 pytest-output.log | while IFS= read -r line; do
              echo "::error::[头部] $line"
            done
            tail -12 pytest-output.log | while IFS= read -r line; do
              echo "::error::[尾部] $line"
            done
          fi
          exit "$code"

      # 覆盖率 HTML 报告留档，需要时下载查看哪几行没被覆盖
      - name: 上传覆盖率报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/htmlcov
          retention-days: 7

  # ══════════════════════════════════════════════════════════════════════
  # 3. 前端检查（用户端 + 管理端）
  # ══════════════════════════════════════════════════════════════════════
  frontend:
    name: 前端 · lint + 单测 + 构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          # 两个前端各自缓存：任一 lock 变化都会重新装
          cache: npm
          cache-dependency-path: |
            frontend-user/package-lock.json
            frontend-admin/package-lock.json

      # ---------- 用户端 ----------
      - name: 用户端 · 安装依赖
        working-directory: frontend-user
        run: npm ci

      - name: 用户端 · 代码检查
        working-directory: frontend-user
        run: npm run lint

      - name: 用户端 · 单元测试
        working-directory: frontend-user
        run: npm run test

      - name: 用户端 · 构建（含 TypeScript 类型检查）
        working-directory: frontend-user
        run: npm run build

      # ---------- 管理端 ----------
      - name: 管理端 · 安装依赖
        working-directory: frontend-admin
        run: npm ci

      - name: 管理端 · 构建（含 vue-tsc 类型检查）
        working-directory: frontend-admin
        run: npm run build

  # ══════════════════════════════════════════════════════════════════════
  # 4. 构建并发布镜像（CI 的最后一关，也是 CD 的开始）
  #
  # 触发条件：仅在 push 到主干时。前面三个 job 全过才会执行——
  # 「测试没过的代码不配被发布」，这条链路用 needs 硬性保证。
  #
  # 发布到哪里：GHCR（ghcr.io），GitHub 自家的镜像仓库，
  # 用 workflow 内置的 GITHUB_TOKEN 即可推送，**不需要配置任何 Secret**。
  #
  # 标签策略（可回滚的关键）：
  #   应用镜像 → latest（始终指向主干最新）+ sha-<短hash>（与提交一一对应）
  #   回滚时只要用旧提交的 sha-xxx tag 重新执行 deploy.sh 即可。
  #   postgres 镜像随 PG 版本走（pg17），不随应用版本变化，用固定 tag。
  #
  # PR 阶段此 job 不执行：只构建不发布的验证（构建是否可成功）已由
  # 后端/前端 job 覆盖，省下每次 PR 几分钟的镜像构建开销。
  # ══════════════════════════════════════════════════════════════════════
  release:
    name: 构建并发布镜像
    runs-on: ubuntu-latest
    needs: [backend-lint, backend-test, frontend]
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write # 推送镜像到 GHCR 必需
    strategy:
      # 一个镜像失败不影响其他镜像继续构建，便于一次性看到全部问题
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: ./backend
            file: ./backend/Dockerfile
            image: ghcr.io/ticnix/weather-backend
          - name: frontend-user
            context: ./frontend-user
            file: ./frontend-user/Dockerfile
            image: ghcr.io/ticnix/weather-frontend-user
          - name: frontend-admin
            context: ./frontend-admin
            file: ./frontend-admin/Dockerfile
            image: ghcr.io/ticnix/weather-frontend-admin
          - name: postgres
            context: .
            file: ./Dockerfile.pg
            image: ghcr.io/ticnix/weather-pg
            fixed_tag: pg17
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 计算这个镜像该打哪些 tag（见 job 头部注释的标签策略）
      - name: 计算镜像标签
        id: tags
        env:
          IMAGE: ${{ matrix.image }}
          SHA: ${{ github.sha }}
        run: |
          if [ -n "${{ matrix.fixed_tag }}" ]; then
            echo "tags=${IMAGE}:${{ matrix.fixed_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tags=${IMAGE}:latest,${IMAGE}:sha-${SHA:0:7}" >> "$GITHUB_OUTPUT"
          fi

      - name: 构建并推送 ${{ matrix.name }} 镜像
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          # 用 GitHub 的缓存服务存 Docker 层，下次构建直接复用
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      # GHCR 的用户级包默认是**私有**的，匿名拉取会 401，
      # 而部署机（deploy.sh）以匿名方式拉取。用 GITHUB_TOKEN 尝试把它
      # 改成 public；若 API 不支持此调用则失败不阻断（去包页面手动改一次即可）。
      - name: 将镜像包设为公开（供部署机匿名拉取）
        continue-on-error: true
        run: |
          PKG_NAME="${{ matrix.image }}"   # ghcr.io/ticnix/weather-backend
          PKG_NAME="${PKG_NAME##*/}"        # → weather-backend
          curl -sS -X PATCH \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/user/packages/container/${PKG_NAME}" \
            -d '{"visibility":"public"}' \
            -o /dev/null -w "设置 ${PKG_NAME} 可见性: HTTP %{http_code}\n" || true
