server {
    listen       80;
    server_name  localhost;

    root   /usr/share/nginx/html;
    index  index.html;

    # Docker 内嵌 DNS（127.0.0.11）。
    # 说明：nginx 默认只在启动时解析一次 upstream 域名并缓存 IP，
    # 后端容器重建后 IP 变化会导致 502；这里改为动态解析 + 10s 缓存。
    resolver 127.0.0.11 valid=10s ipv6=off;

    # SPA 前端路由回退：直接刷新子路径时不应返回 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 反向代理后端 API
    # 注意：proxy_pass 使用变量形式时不会自动带上原 URI，必须拼接 $request_uri
    location /api/ {
        set $backend http://weather-backend:8000;
        proxy_pass         $backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # SSE 流式对话：必须关闭缓冲，否则 token 会被累积后一次性吐出，
    # 前端看不到打字机效果
    location /api/v1/chat/stream {
        set $backend http://weather-backend:8000;
        proxy_pass              $backend$request_uri;
        proxy_http_version      1.1;
        proxy_set_header        Host        $host;
        proxy_set_header        Connection  '';
        proxy_buffering         off;
        proxy_cache             off;
        chunked_transfer_encoding on;
    }

    # 带 hash 的构建产物可长期缓存
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
