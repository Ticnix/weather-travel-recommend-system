[pytest]
# 异步测试：auto 模式下 async def 测试函数无需手动加 @pytest.mark.asyncio
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

testpaths = tests

# ⚠️ 这一行是必需的，别删。
#
# 背景：`pytest` 与 `python -m pytest` 的 sys.path 行为**不一样**——
#   `python -m pytest` 会把当前目录加进 sys.path，所以 `from app import ...` 能成功；
#   直接执行 `pytest` 则不会，于是 conftest 里的 `from app import models` 直接
#   抛 ModuleNotFoundError，pytest 以退出码 4（usage error）结束。
#
# 这个坑的迷惑之处在于：本地习惯用 `python -m pytest` 跑，永远复现不了；
# 一到 CI（直接跑 `pytest`）就挂，而且报错信息看起来像参数用错了。
# 加上 pythonpath 后，两种调用方式都能正确 import，彻底消除这个差异。
pythonpath = .

# -v 详细输出；覆盖率统计 app 与 skills，并在终端列出未覆盖行
addopts =
    -v
    --cov=app
    --cov=skills
    --cov-report=term-missing
    --cov-report=html:htmlcov

# 过滤第三方库的噪声告警
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

[coverage:run]
# 覆盖率统计口径说明：
# - app/scripts/*：命令行入口脚本（init_db / ai_demo），属于"手动执行的一次性工具"
# - app/tasks/*：Celery 任务定义，只是对 service 的调度包装，
#   真正的业务逻辑都在 services 层（已覆盖），任务本身靠集成测试验证
# 排除这些"胶水代码"能让覆盖率真实反映业务逻辑的测试充分度
# 注意用 */ 前缀匹配：Windows 下实际路径是 app\tasks\xxx.py（反斜杠），
# 只写 app/tasks/* 会因为分隔符差异匹配不上
omit =
    */app/scripts/*
    */app/tasks/*
    */__init__.py

[coverage:report]
# 低于 60% 时以非零退出码结束，便于 CI 卡住质量红线
fail_under = 60
show_missing = True
skip_covered = False
