[pytest]
# 异步测试：auto 模式下 async def 测试函数无需手动加 @pytest.mark.asyncio
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

testpaths = tests

# -v 详细输出；覆盖率统计 app 与 skills，并在终端列出未覆盖行
addopts =
    -v
    --cov=app
    --cov=skills
    --cov-report=term-missing
    --cov-report=html:htmlcov

# 过滤第三方库的噪声告警
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

[coverage:run]
# 覆盖率统计口径说明：
# - app/scripts/*：命令行入口脚本（init_db / ai_demo），属于"手动执行的一次性工具"
# - app/tasks/*：Celery 任务定义，只是对 service 的调度包装，
#   真正的业务逻辑都在 services 层（已覆盖），任务本身靠集成测试验证
# 排除这些"胶水代码"能让覆盖率真实反映业务逻辑的测试充分度
# 注意用 */ 前缀匹配：Windows 下实际路径是 app\tasks\xxx.py（反斜杠），
# 只写 app/tasks/* 会因为分隔符差异匹配不上
omit =
    */app/scripts/*
    */app/tasks/*
    */__init__.py

[coverage:report]
# 低于 60% 时以非零退出码结束，便于 CI 卡住质量红线
fail_under = 60
show_missing = True
skip_covered = False
